[project]
name = "actl"
version = "0.1.0"
description = "Agentic Commerce Trust Layer"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "redis>=5.2",
    "httpx2>=2.12.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "hypothesis>=6.115",
    "import-linter>=2.1",
    "ruff>=0.7",
    "mypy>=1.13",
    "testcontainers[postgres]>=4.15.0",
    "jsonschema>=4.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/actl"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's own dependency-injection idiom (`= Depends(...)`, `= Query(...)`)
# relies on a call in the default; these are the framework's documented
# pattern, not the mutable-default footgun B008 exists to catch.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Body"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=actl --cov-report=term-missing"
markers = [
    "real_provider: makes a real network call to a live payment provider API; opt-in only, see tests/integration/payments/test_razorpay_live_smoke.py",
]

[tool.coverage.run]
source = ["actl"]
branch = true

name: ci

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: actl
          POSTGRES_PASSWORD: actl
          POSTGRES_DB: actl
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U actl -d actl"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      APP_ENV: ci
      DATABASE_URL: postgresql+asyncpg://actl:actl@localhost:5432/actl
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (mypy --strict)
        run: uv run mypy src

      - name: Architecture contracts (import-linter)
        run: uv run lint-imports

      - name: Migrate
        run: uv run alembic upgrade head

      - name: Test
        run: uv run pytest tests/unit tests/property tests/architecture -q

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: actl
      POSTGRES_PASSWORD: actl
      POSTGRES_DB: actl
    ports:
      # §28 P10 release-readiness correction: parameterized (not the
      # literal "5432:5432") so scripts/clone_to_demo.sh can request an
      # OS-assigned ephemeral host port (POSTGRES_HOST_PORT=0) and coexist
      # with an already-running ACTL stack on the default port -- a
      # generated Compose override can't do this, because Compose merges
      # `ports:` lists by concatenation across files, not replacement.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - actl_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U actl -d actl"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    command: ["uvicorn", "actl.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: ["python", "-m", "actl.worker"]
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  actl_postgres_data:
